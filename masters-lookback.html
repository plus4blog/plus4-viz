<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>plus4.blog · Masters Lookback</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  /* ── MASTERS COLOR OVERRIDES ────────────────────────────── */
  :root {
    --accent:        #006747;  /* Augusta green */
    --accent-2:      #00843D;  /* lighter Augusta green */
    --filter-active: #006747;
  }

  /* Masters green header (overrides navy from style.css) */
  .header {
    background: linear-gradient(135deg, #002e1f 0%, #006747 55%, #00843D 100%) !important;
  }

  /* ── HEADER ──────────────────────────────────────────────── */
  .lb-header-label {
    color: rgba(255,255,255,0.8);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .lb-header-title {
    color: #fff;
    font-family: 'Archivo Narrow', sans-serif;
    font-size: clamp(32px, 5vw, 56px);
    letter-spacing: 0.03em;
    line-height: 1;
  }
  .lb-header-sub {
    color: rgba(255,255,255,0.7);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    margin-top: 8px;
  }

  /* ── FILTER BAR ──────────────────────────────────────────── */
  .lb-filters {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
  }
  .lb-filters-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }
  .lb-filter-label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 2px;
    white-space: nowrap;
  }
  .lb-filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .lb-btn {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--label);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .lb-btn:hover { border-color: var(--accent-2); color: var(--accent-2); }
  .lb-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lb-divider { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  /* ── MAIN WRAP ───────────────────────────────────────────── */
  .lb-wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 32px 48px;
  }

  /* ── SECTION HEADING ─────────────────────────────────────── */
  .lb-section-title {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* ── INSIGHTS (top signals) ──────────────────────────────── */
  .insights-cards {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 32px;
    scrollbar-width: thin;
  }
  .insight-card {
    flex: 0 0 auto;
    width: 170px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    padding: 14px 16px;
    cursor: default;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .insight-card:hover {
    border-color: #FFCD00;
    box-shadow: 0 2px 10px rgba(255,205,0,0.2);
  }
  .insight-skill {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .insight-course {
    font-family: 'Archivo Narrow', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .insight-score {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #006747;
    letter-spacing: -0.02em;
  }
  .insight-count {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── HEATMAP ─────────────────────────────────────────────── */
  .heatmap-wrap {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    overflow-x: auto;
  }
  .heatmap-grid {
    display: grid;
    grid-template-columns: 100px repeat(5, 1fr);
    min-width: 480px;
  }
  .hm-col-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 6px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }
  .hm-col-header.row-label-header {
    text-align: left;
    padding-left: 14px;
  }
  .hm-row-label {
    background: var(--surface);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 0 14px;
    display: flex;
    align-items: center;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--label);
    white-space: nowrap;
  }
  .hm-row-label:last-of-type { border-bottom: none; }
  /* Course-view row labels: wider col, wrapping text */
  .heatmap-grid.course-view {
    grid-template-columns: 150px repeat(5, 1fr);
    min-width: 520px;
  }
  .heatmap-grid.course-view .hm-row-label {
    font-size: 10px;
    white-space: normal;
    word-break: break-word;
    line-height: 1.3;
    padding: 8px 12px 8px 14px;
    min-height: 44px;
    align-items: flex-start;
    padding-top: 10px;
  }
  .hm-cell {
    border-bottom: 1px solid rgba(0,0,0,0.06);
    border-right: 1px solid rgba(0,0,0,0.06);
    padding: 0;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: filter 0.12s;
    position: relative;
  }
  .hm-cell:hover { filter: brightness(0.9); }
  .hm-cell:last-child { border-right: none; }
  .hm-cell-inner {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: rgba(0,0,0,0.55);
    pointer-events: none;
    user-select: none;
  }
  .hm-cell-inner.strong { color: rgba(0,0,0,0.7); }
  .hm-cell-inner.weak   { color: rgba(0,0,0,0.3); }

  /* ── CALLOUT POPOVER ─────────────────────────────────────── */
  .hm-callout {
    position: fixed;
    z-index: 999;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.14);
    padding: 16px 18px;
    min-width: 220px;
    max-width: 300px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.15s, transform 0.15s;
  }
  .hm-callout.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .callout-header {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .callout-course-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
  }
  .callout-course-row:last-child { border-bottom: none; }
  .callout-course-name {
    color: var(--text);
    font-weight: 500;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .callout-course-score {
    font-weight: 700;
    color: #006747;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .callout-course-score.neutral { color: var(--muted); font-weight: 500; }
  .callout-close {
    position: absolute;
    top: 10px; right: 12px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    color: var(--muted);
    line-height: 1;
    pointer-events: auto;
  }

  .lb-meta {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    padding: 12px 0 0;
    text-align: right;
  }

  @media (max-width: 600px) {
    .lb-filters { padding: 10px 16px; }
    .lb-wrap { padding: 20px 16px 40px; }
    .hm-row-label { font-size: 10px; padding: 0 10px; }
    .hm-cell-inner { font-size: 10px; }
    .insight-card { width: 148px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div>
      <div class="lb-header-label">plus4.blog</div>
      <div class="lb-header-title">Masters Lookback</div>
      <div class="lb-header-sub">Which courses in the weeks before Augusta actually predict Masters performance</div>
    </div>
  </div>
</div>

<!-- FILTERS -->
<div class="lb-filters">
  <div class="lb-filters-inner">
    <span class="lb-filter-label">Year</span>
    <div class="lb-filter-group" id="year-group"></div>
    <div class="lb-divider"></div>
    <span class="lb-filter-label">Tour</span>
    <div class="lb-filter-group" id="tour-group">
      <button class="lb-btn" data-tour="all">All</button>
      <button class="lb-btn active" data-tour="pga">PGA</button>
      <button class="lb-btn" data-tour="euro">Euro</button>
      <button class="lb-btn" data-tour="liv">LIV</button>
    </div>
    <div class="lb-divider"></div>
    <span class="lb-filter-label">View by</span>
    <div class="lb-filter-group" id="view-group">
      <button class="lb-btn" data-view="week">Week</button>
      <button class="lb-btn active" data-view="course">Course</button>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="lb-wrap">

  <!-- INSIGHTS -->
  <div class="lb-section-title">Strongest Historical Signals</div>
  <div class="insights-cards" id="insights-cards"></div>

  <!-- HEATMAP -->
  <div class="lb-section-title" id="heatmap-label">COR Score by Week &amp; Skill</div>
  <div class="heatmap-wrap">
    <div class="heatmap-grid" id="heatmap-grid"></div>
  </div>
  <div class="lb-meta" id="lb-meta"></div>

</div>

<!-- CALLOUT POPOVER -->
<div class="hm-callout" id="hm-callout">
  <button class="callout-close" id="callout-close" aria-label="Close">×</button>
  <div class="callout-header" id="callout-header"></div>
  <div id="callout-body"></div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────
const SKILL_KEYS   = ['sg_ott','sg_app','sg_arg','sg_putt','sg_total'];
const SKILL_LABELS = { sg_ott:'Off Tee', sg_app:'Approach', sg_arg:'Around Green', sg_putt:'Putting', sg_total:'Total' };
const SKILL_SHORT  = { sg_ott:'OTT', sg_app:'APP', sg_arg:'ARG', sg_putt:'Putt', sg_total:'Total' };

// ── State ─────────────────────────────────────────────────────
let allRows     = [];
let activeYears = [];        // multi-select; defaults to ALL years
let activeTour  = 'pga';     // single-select; defaults to PGA
let activeView  = 'course';  // 'week' | 'course'

// ── Helpers ───────────────────────────────────────────────────
function parseCor(str) {
  if (!str) return null;
  const s = str.trim();
  if (!s || s === '—' || s === '-') return null;
  if (s.startsWith('(') && s.endsWith(')')) return -parseFloat(s.slice(1, -1));
  return parseFloat(s);
}

// White → Masters yellow (#FFCD00) → Augusta green (#006747)
function heatColor(val) {
  if (val == null || val <= 0) return '#ffffff';
  const t = Math.min(val / 0.3, 1); // 0–1 over 0–0.3 range
  let r, g, b;
  if (t <= 0.5) {
    // white (255,255,255) → Masters yellow (255,205,0)
    const u = t * 2;
    r = 255;
    g = Math.round(255 - u * 50);  // 255 → 205
    b = Math.round(255 - u * 255); // 255 → 0
  } else {
    // Masters yellow (255,205,0) → Augusta green (0,103,71)
    const u = (t - 0.5) * 2;
    r = Math.round(255 - u * 255); // 255 → 0
    g = Math.round(205 - u * 102); // 205 → 103
    b = Math.round(0   + u * 71);  // 0 → 71
  }
  return `rgb(${r},${g},${b})`;
}

function corStr(val) {
  if (val == null) return '—';
  return (val >= 0 ? '+' : '') + val.toFixed(3);
}

// ── Load ──────────────────────────────────────────────────────
Papa.parse('data/masters_lookback_detail.csv', {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete({ data }) {
    allRows = data.map(r => ({
      year:   parseInt(r['Masters Year'], 10),
      tour:   (r['Tour'] || '').trim().toLowerCase(),
      date:   (r['Event Date'] || '').trim(),
      week:   parseFloat(r['Weeks before Masters']),
      skill:  (r['Skill'] || '').trim().toLowerCase(),
      cor:    parseCor(r['COR Score']),
      sample: parseInt(r['Sample'], 10) || 0,
      course: (r['Course Name'] || '').trim(),
    })).filter(r => r.week <= 16);

    buildYearButtons();
    render();
  }
});

// ── Year buttons (multi-select, all on by default) ───────────
function buildYearButtons() {
  const years = [...new Set(allRows.map(r => r.year))].sort((a, b) => b - a);
  activeYears = years.filter(y => y !== 2020); // default: all except 2020
  const grp = document.getElementById('year-group');
  years.forEach(y => {
    const btn = document.createElement('button');
    btn.className = 'lb-btn' + (y !== 2020 ? ' active' : '');
    btn.dataset.year = y;
    btn.textContent = y;
    btn.addEventListener('click', () => {
      const idx = activeYears.indexOf(y);
      if (idx >= 0) {
        if (activeYears.length === 1) return; // keep ≥1 selected
        activeYears.splice(idx, 1);
      } else {
        activeYears.push(y);
      }
      btn.classList.toggle('active', activeYears.includes(y));
      render();
    });
    grp.appendChild(btn);
  });
}

// ── Tour buttons (single-select) ─────────────────────────────
document.getElementById('tour-group').addEventListener('click', e => {
  const btn = e.target.closest('.lb-btn');
  if (!btn) return;
  activeTour = btn.dataset.tour;
  document.querySelectorAll('#tour-group .lb-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tour === activeTour));
  render();
});

// ── View toggle ───────────────────────────────────────────────
document.getElementById('view-group').addEventListener('click', e => {
  const btn = e.target.closest('.lb-btn');
  if (!btn) return;
  activeView = btn.dataset.view;
  document.querySelectorAll('#view-group .lb-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.view === activeView));
  hideCallout();
  render();
});

// ── Insights (filter-aware, positive signals only) ────────────
function renderInsights(rows) {
  const map = new Map();
  rows.forEach(r => {
    if (r.cor == null || r.cor <= 0) return;
    const k = `${r.course}||${r.skill}`;
    if (!map.has(k)) map.set(k, { course: r.course, skill: r.skill, sum: 0, count: 0 });
    const e = map.get(k);
    e.sum += r.cor;
    e.count++;
  });

  const signals = [...map.values()]
    .filter(e => e.count >= 2)
    .map(e => ({ ...e, avg: e.sum / e.count }))
    .filter(e => e.avg > 0.15)
    .sort((a, b) => b.avg - a.avg)
    .slice(0, 8);

  const container = document.getElementById('insights-cards');
  if (signals.length === 0) {
    container.innerHTML = '<p style="color:var(--muted);font-size:13px;">No strong signals found for this selection.</p>';
    return;
  }

  container.innerHTML = signals.map(s => `
    <div class="insight-card">
      <div class="insight-skill">${SKILL_LABELS[s.skill] || s.skill}</div>
      <div class="insight-course">${titleCase(s.course)}</div>
      <div class="insight-score">${corStr(s.avg)}</div>
      <div class="insight-count">avg across ${s.count} observations</div>
    </div>
  `).join('');
}

function titleCase(str) {
  return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

// ── Render ────────────────────────────────────────────────────
function render() {
  let rows = allRows.filter(r => activeYears.includes(r.year));
  if (activeTour !== 'all') rows = rows.filter(r => r.tour === activeTour);

  renderInsights(rows);

  if (activeView === 'week') {
    renderWeekHeatmap(rows);
  } else {
    renderCourseHeatmap(rows);
  }
}

// ── Week mode: rows = weeks, cols = skills ────────────────────
function renderWeekHeatmap(rows) {
  // Bucket by (flooredWeek, skill); track per-course breakdown
  const heatMap = new Map();
  rows.forEach(r => {
    if (r.cor == null) return;
    const wk = Math.floor(r.week);
    const k  = `${wk}||${r.skill}`;
    if (!heatMap.has(k)) heatMap.set(k, { sum: 0, count: 0, courses: new Map() });
    const b = heatMap.get(k);
    b.sum += r.cor;
    b.count++;
    if (!b.courses.has(r.course)) b.courses.set(r.course, { sum: 0, count: 0 });
    const cb = b.courses.get(r.course);
    cb.sum += r.cor;
    cb.count++;
  });

  const weekNums = [...new Set(rows.map(r => Math.floor(r.week)))]
    .sort((a, b) => a - b);
  const grid = buildGridShell('Week', false);

  weekNums.forEach(wk => {
    const rowLabel = document.createElement('div');
    rowLabel.className = 'hm-row-label';
    rowLabel.textContent = wk === 1 ? 'Wk 1 ★' : `Wk ${wk}`;
    grid.appendChild(rowLabel);

    SKILL_KEYS.forEach(sk => {
      const bucket = heatMap.get(`${wk}||${sk}`);
      const avg    = bucket ? bucket.sum / bucket.count : null;
      const courseList = bucket
        ? [...bucket.courses.entries()]
            .map(([name, v]) => ({ name, avg: v.sum / v.count }))
            .filter(c => c.avg > 0)
            .sort((a, b) => b.avg - a.avg)
        : [];
      const label = `${SKILL_LABELS[sk]} · Week ${wk}${wk === 1 ? ' (Final week)' : ' before Masters'}`;
      grid.appendChild(makeCell(avg, label, courseList, 'week', wk, sk));
    });
  });

  updateMeta(weekNums.length + ' weeks');
  document.getElementById('heatmap-label').textContent =
    activeYears.length > 1
      ? `Avg COR Score by Week & Skill — ${activeYears.slice().sort().join(', ')}`
      : `COR Score by Week & Skill — ${activeYears[0]}`;
}

// ── Course mode: rows = courses sorted by avg week ────────────
function renderCourseHeatmap(rows) {
  // Bucket by (course, skill); also compute per-course avg week for sort
  const courseMap  = new Map(); // `${course}||${skill}` → {sum,count,points:[]}
  const weekMap    = new Map(); // course → {sum,count} for avg week

  rows.forEach(r => {
    if (r.cor == null) return;
    const k = `${r.course}||${r.skill}`;
    if (!courseMap.has(k)) courseMap.set(k, { sum: 0, count: 0, points: [] });
    const b = courseMap.get(k);
    b.sum += r.cor;
    b.count++;
    b.points.push({ year: r.year, week: Math.floor(r.week), cor: r.cor });

    // Sort order uses only 2023-2025 — most stable recent timing
    if ([2023, 2024, 2025].includes(r.year)) {
      if (!weekMap.has(r.course)) weekMap.set(r.course, { sum: 0, count: 0 });
      const wb = weekMap.get(r.course);
      wb.sum += r.week;
      wb.count++;
    }
  });

  // Fall back to all years for courses not present in 2023-2025
  rows.forEach(r => {
    if (weekMap.has(r.course)) return;
    if (!weekMap.has(r.course)) weekMap.set(r.course, { sum: 0, count: 0 });
    const wb = weekMap.get(r.course);
    wb.sum += r.week;
    wb.count++;
  });

  // Sort courses by avg week ascending (closest to Masters = smallest week # = first)
  const courses = [...weekMap.keys()].sort((a, b) => {
    const wa = weekMap.get(a); const wb = weekMap.get(b);
    return (wa.sum / wa.count) - (wb.sum / wb.count);
  });

  const grid = buildGridShell('Course', true);

  courses.forEach(course => {
    const rowLabel = document.createElement('div');
    rowLabel.className = 'hm-row-label';
    rowLabel.textContent = titleCase(course);
    grid.appendChild(rowLabel);

    SKILL_KEYS.forEach(sk => {
      const bucket = courseMap.get(`${course}||${sk}`);
      const avg    = bucket ? bucket.sum / bucket.count : null;
      const points = bucket
        ? bucket.points.filter(p => p.cor > 0).sort((a, b) => a.week - b.week)
        : [];
      const label = `${SKILL_LABELS[sk]} · ${titleCase(course)}`;
      grid.appendChild(makeCell(avg, label, points, 'course', course, sk));
    });
  });

  updateMeta(courses.length + ' courses');
  document.getElementById('heatmap-label').textContent =
    activeYears.length > 1
      ? `Avg COR Score by Course & Skill — ${activeYears.slice().sort().join(', ')}`
      : `COR Score by Course & Skill — ${activeYears[0]}`;
}

// ── Shared grid shell (headers only) ─────────────────────────
function buildGridShell(rowHeaderLabel, isCourseView) {
  const grid = document.getElementById('heatmap-grid');
  grid.innerHTML = '';
  grid.className = 'heatmap-grid' + (isCourseView ? ' course-view' : '');

  const corner = document.createElement('div');
  corner.className = 'hm-col-header row-label-header';
  corner.textContent = rowHeaderLabel;
  grid.appendChild(corner);

  SKILL_KEYS.forEach(sk => {
    const th = document.createElement('div');
    th.className = 'hm-col-header';
    th.textContent = SKILL_SHORT[sk];
    grid.appendChild(th);
  });

  return grid;
}

// ── Build a single heatmap cell ───────────────────────────────
// mode='week': calloutData = [{name, avg}] (courses)
// mode='course': calloutData = [{year, week, cor}] (data points)
function makeCell(avg, calloutTitle, calloutData, mode, rowKey, sk) {
  const cell = document.createElement('div');
  cell.className = 'hm-cell';
  cell.style.background = heatColor(avg);

  const inner = document.createElement('div');
  inner.className = 'hm-cell-inner';
  if (avg != null) {
    inner.textContent = (avg >= 0 ? '+' : '') + avg.toFixed(2);
    inner.classList.add(avg > 0.1 ? 'strong' : 'weak');
  } else {
    inner.textContent = '—';
    inner.classList.add('weak');
  }
  cell.appendChild(inner);

  cell.addEventListener('click', ev => showCallout(ev, calloutTitle, calloutData, mode));
  return cell;
}

function updateMeta(desc) {
  const yearLabel = activeYears.length === 1
    ? `${activeYears[0]} Masters`
    : `${activeYears.slice().sort().join(', ')} Masters (averaged)`;
  document.getElementById('lb-meta').textContent = `${desc} · ${yearLabel}`;
}

// ── Callout popover ───────────────────────────────────────────
const callout    = document.getElementById('hm-callout');
const calloutHdr = document.getElementById('callout-header');
const calloutBdy = document.getElementById('callout-body');

document.getElementById('callout-close').addEventListener('click', hideCallout);

document.addEventListener('click', e => {
  if (!callout.contains(e.target) && !e.target.closest('.hm-cell')) {
    hideCallout();
  }
});

function showCallout(ev, title, data, mode) {
  ev.stopPropagation();
  calloutHdr.textContent = title;

  if (data.length === 0) {
    calloutBdy.innerHTML = '<p style="color:var(--muted);font-size:12px;padding:4px 0">No positive correlations for this cell.</p>';
  } else if (mode === 'week') {
    // data = [{name, avg}] — courses
    calloutBdy.innerHTML = data.map(c => `
      <div class="callout-course-row">
        <span class="callout-course-name" title="${c.name}">${titleCase(c.name)}</span>
        <span class="callout-course-score">${corStr(c.avg)}</span>
      </div>
    `).join('');
  } else {
    // mode === 'course', data = [{year, week, cor}]
    calloutBdy.innerHTML = data.map(p => `
      <div class="callout-course-row">
        <span class="callout-course-name">${p.year} · Wk ${p.week}</span>
        <span class="callout-course-score">${corStr(p.cor)}</span>
      </div>
    `).join('');
  }

  callout.classList.add('visible');
  positionCallout(ev.clientX, ev.clientY);
}

function positionCallout(cx, cy) {
  const w = callout.offsetWidth  || 260;
  const h = callout.offsetHeight || 200;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let left = cx + 14;
  let top  = cy + 14;
  if (left + w > vw - 12) left = cx - w - 14;
  if (top  + h > vh - 12) top  = cy - h - 14;
  callout.style.left = left + 'px';
  callout.style.top  = top  + 'px';
}

function hideCallout() {
  callout.classList.remove('visible');
}
</script>

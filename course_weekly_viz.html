<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>plus4.blog · Weekly Course Breakdown</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap');

  :root {
    --bg:        #ffffff;
    --surface:   #f4f4f4;
    --card:      #ffffff;
    --border:    #e0e0e0;
    --accent:    #cc1f1f;
    --gold:      #c8960a;
    --positive:  #22c55e;
    --negative:  #ef4444;
    --text:      #111111;
    --muted:     #777777;
    --label:     #444444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    overflow-x: hidden;
  }

  /* ── HEADER ─────────────────────────────────────────────────── */
  .header {
    background: linear-gradient(135deg, #1a0000 0%, #cc1f1f 50%, #8b0000 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 32px 24px;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 80% at 80% 50%, rgba(255,255,255,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .course-label {
    color: rgba(255,255,255,0.8) !important;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .course-name {
    color: #ffffff !important;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 5vw, 64px);
    letter-spacing: 0.03em;
    line-height: 1;
    color: var(--text);
  }

  .course-meta {
    display: flex;
    gap: 20px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .meta-pill {
    color: rgba(255,255,255,0.7) !important;
    background: rgba(255,255,255,0.1) !important;
    border-color: rgba(255,255,255,0.2) !important;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 11px;
    color: var(--label);
    background: rgba(204,31,31,0.05);
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border-radius: 4px;
    padding: 4px 10px;
  }

  .meta-pill span { color: var(--accent); font-weight: 500; }

  /* ── CONTROLS ────────────────────────────────────────────────── */
  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  .controls-inner {
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  .ctrl-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  select, input[type="file"] {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 13px;
    padding: 7px 12px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }

  select:hover, select:focus { border-color: var(--accent); }

  .skill-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .skill-tab {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .skill-tab:hover { border-color: var(--accent); color: var(--accent); }
  .skill-tab.active { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }

  .upload-btn {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .file-label {
    display: inline-block;
    background: var(--accent);
    color: #ffffff;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }

  .file-label:hover { opacity: 0.85; }

  /* ── GRID ────────────────────────────────────────────────────── */
  .grid-wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 32px;
  }

  .player-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── PLAYER CARD ─────────────────────────────────────────────── */
  .player-card {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.4s ease both;
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 320px;
    max-height: 320px;
  }

  .player-card:hover {
    border-color: rgba(204,31,31,0.4);
    box-shadow: 0 4px 20px rgba(0,0,0,0.10);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 16px 14px;
    border-right: 1px solid var(--border);
    background: #f9f9f9;
    gap: 8px;
    overflow-y: auto;
  }

  .player-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .skill-summary {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 4px;
  }

  .skill-summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }

  .skill-summary-name {
    color: var(--muted);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .skill-summary-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 0.05em;
  }

  .skill-bar-wrap {
    flex: 1;
    height: 4px;
    background: #e8e8e8;
    border-radius: 2px;
    margin: 0 8px;
    overflow: visible;
    position: relative;
  }

  .skill-bar {
    position: absolute;
    height: 100%;
    border-radius: 2px;
    top: 0;
  }

  .skill-course-count {
    font-size: 10px;
    color: var(--muted);
    text-align: right;
    margin-top: -2px;
    margin-bottom: 4px;
    font-family: 'Source Sans 3', sans-serif;
    letter-spacing: 0.04em;
  }

  /* ── SPLIT LAYOUT (single skill mode) ──────────────────────── */
  .split-body {
    display: flex;
    width: 100%;
    height: 270px;
  }

  .split-radar {
    width: 50%;
    height: 270px;
    border-right: 1px solid var(--border);
    padding: 0 8px 0 0;
    display: flex;
    flex-direction: column;
  }

  .split-radar .radar-skill-label {
    height: 20px;
    flex-shrink: 0;
  }

  .split-radar .radar-single {
    width: 100%;
    height: 250px;
    position: relative;
  }

  .split-radar .radar-single canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100% !important;
    height: 250px !important;
  }

  .split-table {
    width: 50%;
    height: 270px;
    padding-left: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── COURSE TABLE (single skill mode) ───────────────────────── */
  .course-table-wrap {
    width: 100%;
    height: 250px;
    overflow-y: auto;
    overflow-x: hidden;
    border-top: 1px solid var(--border);
  }

  .course-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 13px;
  }

  .course-table thead tr {
    border-bottom: 2px solid var(--border);
  }

  .course-table th {
    text-align: left;
    padding: 6px 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    white-space: nowrap;
  }

  .course-table tbody tr {
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.1s;
  }

  .course-table tbody tr:hover { background: #fafafa; }

  .course-table td {
    padding: 6px 10px;
    white-space: nowrap;
  }

  .ct-course { color: var(--text); font-weight: 500; width: 100%; white-space: normal; }
  .ct-val    { font-family: 'Bebas Neue', sans-serif; font-size: 15px; text-align: right; }
  .ct-r      { color: var(--muted); text-align: right; font-size: 12px; }
  .ct-p      { color: var(--muted); text-align: right; font-size: 12px; }

  .dk-salary {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 13px;
    color: var(--gold);
    font-weight: 500;
  }

  .card-body {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    flex: 1;
  }

  /* ── SKILL TABS ON CARD — hidden, all 5 shown at once ──────── */
  .card-skill-tabs {
    display: none;
  }

  .card-skill-btn {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.12s;
  }

  .card-skill-btn:hover { border-color: var(--accent); color: var(--accent); }
  .card-skill-btn.active { background: rgba(204,31,31,0.15); border-color: var(--accent); color: var(--accent); }

  .radar-wrap {
    display: flex;
    flex-direction: row;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 8px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    flex: 1;
  }

  .radar-wrap::-webkit-scrollbar {
    height: 4px;
  }
  .radar-wrap::-webkit-scrollbar-track {
    background: #f0f0f0;
    border-radius: 2px;
  }
  .radar-wrap::-webkit-scrollbar-thumb {
    background: #d0d0d0;
    border-radius: 2px;
  }

  .radar-slot {
    flex: 0 0 220px;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
  }

  .radar-single {
    position: relative;
    height: 200px;
    flex: 1;
  }

  .radar-skill-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-align: center;
    margin-bottom: 4px;
    white-space: nowrap;
  }

  .no-data {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 220px;
    color: var(--muted);
    font-size: 12px;
    font-family: 'Source Sans 3', sans-serif;
    letter-spacing: 0.1em;
  }

  /* ── EMPTY / LOADING STATES ──────────────────────────────────── */
  .state-msg {
    text-align: center;
    padding: 80px 32px;
    color: var(--muted);
  }

  .state-msg h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 0.05em;
    color: var(--label);
    margin-bottom: 10px;
  }

  .state-msg p {
    font-size: 14px;
    line-height: 1.6;
    max-width: 380px;
    margin: 0 auto;
  }

  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 48px 32px;
    text-align: center;
    margin: 48px auto;
    max-width: 480px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .upload-area:hover { border-color: var(--accent); }

  .upload-icon {
    font-size: 36px;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  .upload-cta {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 8px;
  }



  .player-count {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 11px;
    color: var(--muted);
    padding: 0 32px;
    margin-bottom: -12px;
    max-width: 1400px;
    margin-left: auto;
    margin-right: auto;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div>
      <div class="course-label">This Week's Course</div>
      <div class="course-name" id="course-title">—</div>
      <div class="course-meta" id="course-meta"></div>
    </div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="controls-inner">
    <span class="ctrl-label">Sort by salary</span>
    <select id="sort-dir">
      <option value="desc">High → Low</option>
      <option value="asc">Low → High</option>
    </select>

    <span class="ctrl-label" style="margin-left:12px;">Filter skill</span>
    <div class="skill-tabs" id="global-skill-tabs">
      <!-- populated dynamically -->
    </div>

    <span id="load-status" class="ctrl-label" style="margin-left:auto;color:var(--muted);font-style:italic;"></span>
  </div>
</div>

<!-- GRID -->
<div class="grid-wrap">
  <div class="player-count" id="player-count"></div>

  <div id="empty-state" style="display:none;"></div>

  <div class="player-grid" id="player-grid"></div>
</div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
let allData      = [];    // raw parsed rows
let players      = [];    // [{name, salary, courses: {skill -> [{course, value, r}]}}]
let activeSkill  = null;  // skill shown in global filter (null = all)
let sortDir      = 'desc';
let chartInstances = {};  // canvasId -> Chart instance

const SKILL_LABELS = {
  sg_ott  : 'Off the Tee',
  sg_app  : 'Approach',
  sg_arg  : 'Around Green',
  sg_putt : 'Putting',
  sg_total: 'Total'
};

const SKILL_COLORS = {
  sg_ott  : 'rgba(204,31,31,0.85)',
  sg_app  : 'rgba(240,180,41,0.7)',
  sg_arg  : 'rgba(34,197,94,0.7)',
  sg_putt : 'rgba(168,85,247,0.7)',
  sg_total: 'rgba(249,115,22,0.7)'
};

// ── CSV LOADING ───────────────────────────────────────────────────────────────
const CSV_URL = 'https://raw.githubusercontent.com/plus4blog/plus4-viz/main/course_skill_lookup.csv';

function loadCSV() {
  const status = document.getElementById('load-status');
  status.textContent = 'Loading data...';

  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    dynamicTyping: true,
    complete: result => {
      allData = result.data;
      processData();
      status.textContent = `Updated ${new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}`;
    },
    error: err => {
      status.textContent = 'Failed to load data';
      console.error('CSV fetch error:', err);
    }
  });
}

loadCSV();

function processData() {
  if (!allData.length) return;

  // ── Detect course of the week (most frequent course_num in data,
  //    or use anchor course_num if present — here we use related_course_name
  //    diversity as a proxy; the header shows the anchor course)
  // We assume the CSV was generated for one anchor course_num.
  // Pull it from a column if present, else derive from filename context.
  const anchorCourse = allData[0]?.anchor_course_name
    || allData[0]?.anchor_course_num
    || '(Anchor Course)';

  document.getElementById('course-title').textContent =
    allData[0]?.anchor_course_name || 'Weekly Course';

  // Meta pills
  const uniqueCourses = [...new Set(allData.map(r => r.course_num_b).filter(Boolean))];
  const uniquePlayers = [...new Set(allData.map(r => r.player_name).filter(Boolean))];
  const skills        = [...new Set(allData.map(r => r.skill).filter(Boolean))];

  document.getElementById('course-meta').innerHTML = `
    <div class="meta-pill">Players: <span>${uniquePlayers.length}</span></div>
    <div class="meta-pill">Correlated Courses: <span>${uniqueCourses.length}</span></div>
    <div class="meta-pill">Skills: <span>${skills.length}</span></div>
  `;

  // ── Build global skill tabs
  buildGlobalSkillTabs(skills);

  // ── Group by player
  const playerMap = {};
  allData.forEach(row => {
    if (!row.player_name) return;
    if (!playerMap[row.player_name]) {
      playerMap[row.player_name] = {
        name  : row.player_name,
        salary: row.dk_price || row.dk_salary || row.draftkings_salary || row.salary || 0,
        courses: {}
      };
    }
    const skill = row.skill;
    if (!playerMap[row.player_name].courses[skill]) {
      playerMap[row.player_name].courses[skill] = [];
    }
    const r = parseFloat(row.blended_r) || 0;
    if (Math.abs(r) <= 0.05) return;
    playerMap[row.player_name].courses[skill].push({
      course      : row.course_name_b || row.course_num_b || 'Unknown',
      value       : parseFloat(row.avg_value) || 0,
      r,
      p           : parseFloat(row.p_value) || 0,
      event_count : parseInt(row.event_count) || 0
    });
  });

  players = Object.values(playerMap);
  renderGrid();
}

function buildGlobalSkillTabs(skills) {
  const container = document.getElementById('global-skill-tabs');
  container.innerHTML = '';

  // "All" tab
  const allBtn = document.createElement('button');
  allBtn.className = 'skill-tab active';
  allBtn.textContent = 'All';
  allBtn.onclick = () => {
    activeSkill = null;
    document.querySelectorAll('.skill-tab').forEach(b => b.classList.remove('active'));
    allBtn.classList.add('active');
    renderGrid();
  };
  container.appendChild(allBtn);

  // Order skills predictably
  const order = ['sg_total','sg_ott','sg_app','sg_arg','sg_putt'];
  const ordered = [...order.filter(s => skills.includes(s)), ...skills.filter(s => !order.includes(s))];

  ordered.forEach(skill => {
    const btn = document.createElement('button');
    btn.className = 'skill-tab';
    btn.textContent = SKILL_LABELS[skill] || skill;
    btn.onclick = () => {
      activeSkill = skill;
      document.querySelectorAll('.skill-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    };
    container.appendChild(btn);
  });
}

// ── RENDER GRID ───────────────────────────────────────────────────────────────
function renderGrid() {
  document.getElementById('empty-state').style.display = 'none';

  // Sort by DK salary
  const sorted = [...players].sort((a, b) =>
    sortDir === 'desc' ? b.salary - a.salary : a.salary - b.salary
  );

  document.getElementById('player-count').textContent =
    `${sorted.length} players · sorted by DraftKings salary`;

  // Destroy old chart instances
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};

  const grid = document.getElementById('player-grid');
  grid.innerHTML = '';

  sorted.forEach((player, idx) => {
    const card = buildPlayerCard(player, idx);
    grid.appendChild(card);
  });
}

// ── PLAYER CARD ───────────────────────────────────────────────────────────────
function buildPlayerCard(player, idx) {
  const card = document.createElement('div');
  card.className = 'player-card';
  card.style.animationDelay = `${Math.min(idx * 30, 400)}ms`;

  const skills = Object.keys(player.courses);
  const order  = ['sg_total','sg_ott','sg_app','sg_arg','sg_putt'];
  const orderedSkills = [...order.filter(s => skills.includes(s)), ...skills.filter(s => !order.includes(s))];

  // If a global skill filter is active, only show that skill
  const displaySkills = activeSkill
    ? (orderedSkills.includes(activeSkill) ? [activeSkill] : [])
    : orderedSkills;

  // Default to first skill shown
  let currentSkill = displaySkills[0] || null;

  const salaryStr = player.salary
    ? '$' + Number(player.salary).toLocaleString()
    : '—';

  // Build skill summary rows for sidebar
  const skillSummaryHTML = displaySkills.map(skill => {
    const pts = player.courses[skill];
    if (!pts || !pts.length) return '';
    const avg = pts.reduce((a,b) => a + b.value, 0) / pts.length;
    const t = Math.max(-1, Math.min(1, avg / 1.5));
    function lerp(a,b,x){return Math.round(a+(b-a)*x);}
    let r,g,b2;
    if (t < 0) { const x=t+1; r=lerp(220,160,x); g=lerp(38,160,x); b2=lerp(38,160,x); }
    else        { const x=t;   r=lerp(160,34,x);  g=lerp(160,197,x); b2=lerp(160,94,x); }
    const color = `rgb(${r},${g},${b2})`;
    const sign  = avg >= 0 ? '+' : '';
    const pct   = Math.abs(t) * 50;
    const barLeft = avg >= 0 ? '50%' : `${50 - pct}%`;
    const courseCount = pts.length;
    return `
      <div class="skill-summary-row">
        <span class="skill-summary-name">${SKILL_LABELS[skill] || skill}</span>
        <div class="skill-bar-wrap">
          <div class="skill-bar" style="width:${pct}%;left:${barLeft};background:${color};"></div>
        </div>
        <span class="skill-summary-val" style="color:${color}">${sign}${avg.toFixed(2)}</span>
      </div>
      <div class="skill-course-count">${courseCount} course${courseCount !== 1 ? 's' : ''}</div>`;
  }).join('');

  const isSingleSkill = displaySkills.length === 1;

  let bodyContent;
  if (isSingleSkill) {
    const skill = displaySkills[0];
    const pts   = player.courses[skill] || [];
    const sorted = [...pts].sort((a, b) => b.event_count - a.event_count);
    const rows = sorted.map(d => {
      const sign = d.value >= 0 ? '+' : '';
      const t2 = Math.max(-1, Math.min(1, d.value / 1.5));
      function lerp(a,b,x){return Math.round(a+(b-a)*x);}
      let r,g,b2;
      if (t2 < 0) { const x=t2+1; r=lerp(220,160,x); g=lerp(38,160,x); b2=lerp(38,160,x); }
      else         { const x=t2;   r=lerp(160,34,x);  g=lerp(160,197,x); b2=lerp(160,94,x); }
      const color = `rgb(${r},${g},${b2})`;
      return `<tr>
        <td class="ct-course">${d.course}</td>
        <td class="ct-val" style="color:${color}">${sign}${d.value.toFixed(3)}</td>
        <td class="ct-r">${d.r >= 0 ? '+' : ''}${d.r.toFixed(2)}</td>
        <td class="ct-p">${d.p !== undefined ? d.p.toFixed(3) : '—'}</td>
      </tr>`;
    }).join('');
    // Split: radar on left, table on right
    bodyContent = `
      <div class="split-body">
        <div class="split-radar">
          <div class="radar-skill-label">${SKILL_LABELS[skill] || skill}</div>
          <div class="radar-single">
            <canvas id="radar-${idx}-0"></canvas>
            <div class="no-data" id="nodata-${idx}-0" style="display:none;">No data</div>
          </div>
        </div>
        <div class="split-table">
          <div class="course-table-wrap">
            <table class="course-table">
              <thead><tr>
                <th>Course</th>
                <th>Avg</th>
                <th>r</th>
                <th>p</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      </div>`;
  } else {
    // Multiple skills — scrollable radar grid
    const radarSlotsHTML = displaySkills.map((skill, si) => `
      <div class="radar-slot">
        <div class="radar-skill-label">${SKILL_LABELS[skill] || skill}</div>
        <div class="radar-single">
          <canvas id="radar-${idx}-${si}"></canvas>
          <div class="no-data" id="nodata-${idx}-${si}" style="display:none;">No data</div>
        </div>
      </div>`).join('');
    bodyContent = `<div class="radar-wrap">${radarSlotsHTML}</div>`;
  }

  card.innerHTML = `
    <div class="card-header">
      <div>
        <div class="player-name">${player.name}</div>
        <div class="dk-salary">${salaryStr}</div>
      </div>
      <div class="skill-summary">${skillSummaryHTML}</div>
    </div>
    <div class="card-body">
      <div class="card-skill-tabs"></div>
      ${bodyContent}
    </div>
  `;

  setTimeout(() => {
    if (isSingleSkill) {
      drawRadar(`${idx}-0`, player, displaySkills[0]);
    } else {
      displaySkills.forEach((skill, si) => {
        drawRadar(`${idx}-${si}`, player, skill);
      });
    }
  }, 0);

  return card;
}

// ── RADAR CHART ───────────────────────────────────────────────────────────────
function drawRadar(canvasId, player, skill) {
  const noDataEl = document.getElementById(`nodata-${canvasId}`);
  const canvas   = document.getElementById(`radar-${canvasId}`);

  if (chartInstances[canvasId]) {
    chartInstances[canvasId].destroy();
    delete chartInstances[canvasId];
  }

  const points = player.courses[skill];
  if (!points || !points.length) {
    canvas.style.display = 'none';
    noDataEl.style.display = 'flex';
    return;
  }

  canvas.style.display = 'block';
  noDataEl.style.display = 'none';

  // Sort by |r| × (1 - p_value) so high correlation AND significance come first
  const sorted = [...points].sort((a, b) => b.event_count - a.event_count);

  // Cap axes for readability
  const MAX_AXES = 15;
  const display  = sorted.slice(0, MAX_AXES);

  const labels = display.map(d => truncate(d.course, 18));
  const values = display.map(d => d.value);

  // Determine scale bounds — fixed per skill
  const allVals = values.filter(v => isFinite(v));
  const bound   = skill === 'sg_total' ? 1.5 : 1.0;

  // ── Dynamic red → green color based on average value across axes
  const avgVal = allVals.reduce((a, b) => a + b, 0) / allVals.length;
  const t = Math.max(-1, Math.min(1, avgVal / (bound || 1)));

  function lerp(a, b, x) { return Math.round(a + (b - a) * x); }
  let rc, gc, bc;
  if (t < 0) {
    // negative: red → neutral grey
    const x = t + 1;
    rc = lerp(220, 160, x); gc = lerp(38, 160, x); bc = lerp(38, 160, x);
  } else {
    // positive: neutral grey → green
    const x = t;
    rc = lerp(160, 34, x); gc = lerp(160, 197, x); bc = lerp(160, 94, x);
  }
  const colorSolid  = `rgb(${rc},${gc},${bc})`;
  const colorBorder = `rgba(${rc},${gc},${bc},0.9)`;

  const ctx = canvas.getContext('2d');

  // Simple solid fill — green, white, or red based on overall avg
  const colorFill = `rgba(${rc},${gc},${bc},0.25)`;
  chartInstances[canvasId] = new Chart(ctx, {
    type: 'radar',
    data: {
      labels,
      datasets: [
        {
          // hidden zero baseline — fill between this and the data dataset
          label: '_baseline',
          data: values.map(() => 0),
          backgroundColor: 'transparent',
          borderColor: 'transparent',
          pointRadius: 0,
          fill: false
        },
        {
          label: SKILL_LABELS[skill] || skill,
          data: values,
          backgroundColor: colorFill,
          borderColor: colorBorder,
          pointBackgroundColor: display.map(d => {
            const t2 = Math.max(-1, Math.min(1, d.value / (bound || 1)));
            let rp, gp, bp;
            if (t2 < 0) { const x=t2+1; rp=lerp(220,160,x); gp=lerp(38,160,x); bp=lerp(38,160,x); }
            else         { const x=t2;   rp=lerp(160,34,x);  gp=lerp(160,197,x); bp=lerp(160,94,x); }
            return `rgb(${rp},${gp},${bp})`;
          }),
          pointBorderColor: 'transparent',
          pointRadius: 4,
          borderWidth: 1.5,
          fill: '-1'   // fill back to the zero baseline dataset
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#ffffff',
          borderColor: '#e0e0e0',
          borderWidth: 1,
          titleColor: '#111111',
          bodyColor: '#555555',
          titleFont: { family: 'DM Mono', size: 11 },
          bodyFont:  { family: 'DM Mono', size: 11 },
          callbacks: {
            title: items => display[items[0].dataIndex]?.course || '',
            label: item  => {
              const d = display[item.dataIndex];
              const sign = d.value >= 0 ? '+' : '';
              return `${sign}${d.value.toFixed(3)}  (r=${d.r.toFixed(2)})`;
            }
          }
        }
      },
      scales: {
        r: {
          min: -bound,
          max:  bound,
          ticks: {
            display: false,
            stepSize: bound / 2
          },
          grid: {
            color: 'rgba(200,200,200,0.8)'
          },
          angleLines: {
            color: 'rgba(200,200,200,0.6)'
          },
          pointLabels: {
            font: { family: 'DM Sans', size: 9 },
            color: '#999999',
            padding: 4
          }
        }
      }
    }
  });
}

function truncate(str, n) {
  return str && str.length > n ? str.slice(0, n - 1) + '…' : str;
}

// ── SORT CONTROL ──────────────────────────────────────────────────────────────
document.getElementById('sort-dir').addEventListener('change', e => {
  sortDir = e.target.value;
  if (players.length) renderGrid();
});

// ── IFRAME HEIGHT REPORTING ───────────────────────────────────────────────────
function reportHeight() {
  const h = document.documentElement.scrollHeight;
  window.parent.postMessage({ type: 'plus4-resize', height: h }, '*');
}
// Report after grid renders and charts animate
const _origRenderGrid = renderGrid;
renderGrid = function() {
  _origRenderGrid();
  setTimeout(reportHeight, 600);
};
</script>

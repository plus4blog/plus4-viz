<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>plus4.blog · Weekly Course Breakdown</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div>
      <div class="course-label">This Week's Course</div>
      <div class="course-name" id="course-title">—</div>
      <div class="course-meta" id="course-meta"></div>
    </div>
  </div>
</div>

<!-- COURSE BREAKDOWN -->
<div class="breakdown-wrap">
  <div class="breakdown-header">
    <div class="breakdown-title">Course Correlations</div>
    <div class="breakdown-controls">
      <span class="ctrl-label">Skill filters</span>
      <div class="skill-tabs" id="breakdown-skill-tabs"></div>
      <span class="ctrl-label" style="margin-left:12px;">Sort</span>
      <select id="breakdown-sort">
        <option value="r">R-value</option>
        <option value="vintage">Vintage</option>
      </select>
    </div>
  </div>
  <div class="breakdown-table-wrap">
    <table class="breakdown-table" id="breakdown-table">
      <thead>
        <tr>
          <th class="bd-course">Course</th>
          <th class="bd-skill">Skill</th>
          <th class="bd-r">R-value</th>
          <th class="bd-vintage">Vintage</th>
          <th class="bd-events">Events</th>
        </tr>
      </thead>
      <tbody id="breakdown-tbody"></tbody>
    </table>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="controls-inner">
    <span class="ctrl-label">Sort by</span>
    <select id="sort-by">
      <option value="salary">Salary</option>
      <option value="sg_total">SG Total</option>
      <option value="course_fit">Course Fit</option>
    </select>
    <select id="sort-dir">
      <option value="desc">High → Low</option>
      <option value="asc">Low → High</option>
    </select>

    <span id="load-status" class="ctrl-label" style="margin-left:auto;color:var(--muted);font-style:italic;"></span>
  </div>
</div>

<!-- GRID -->
<div class="grid-wrap">
  <div class="grid-section-header">
    <div>
      <span class="grid-section-title">Player–Course Fit</span>
      <span class="grid-section-sub">+/- vs. player's base skill</span>
    </div>
    <div class="grid-section-controls">
      <span class="ctrl-label">Skill filters</span>
      <div class="skill-tabs" id="global-skill-tabs"></div>
    </div>
  </div>
  <div class="player-count" id="player-count"></div>

  <div id="empty-state" style="display:none;"></div>

  <div class="player-grid" id="player-grid"></div>
</div>

<script src="app.js"></script>
</body>
</html>
